name: Test agent

# Writes or updates unit tests for the code a pull request changes, verifies
# them independently and commits them to the pull request branch.
#
#   generate  read-only; the only job with the LLM key. Runs the agent and
#             turns its edits into a patch.
#   verify    read-only, no secrets. Validates the patch and runs the test
#             suites before and after it inside a network-less sandbox.
#   publish   can write, but never runs code from the pull request. Commits
#             the verified patch and posts the report.
#
# Tooling (agent, scripts, policy, sandbox) always comes from the base commit,
# so a pull request cannot weaken the checks that are applied to it.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  generate:
    name: Generate tests
    # Forks get neither secrets nor a write token. Drafts, opted-out pull
    # requests and the bot's own pushes are skipped.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'skip-test-agent')
      && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # LLM_API_KEY is an environment secret, so only this job can read it.
    environment: test-agent
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.changes.outputs.has_testable_changes }}
      agent_exit: ${{ steps.agent.outputs.exit_code }}
      patch_sha256: ${{ steps.patch.outputs.sha256 }}
    steps:
      - name: Check out tooling (base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          fetch-depth: 0 # detect_changes.py diffs from the merge base
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Detect changes
        id: changes
        run: |
          mkdir -p out
          python tooling/.github/scripts/detect_changes.py \
            --repo target --base "$BASE_SHA" --head "$HEAD_SHA" \
            --policy tooling/.github/test-agent.toml \
            --out out/changes.json --github-output
          cat out/changes.json

      - name: Run test agent
        id: agent
        if: steps.changes.outputs.has_testable_changes == 'true'
        timeout-minutes: 20
        env:
          PYTHONPATH: tooling/agent/src
          TEST_AGENT_ENGINE: ${{ vars.TEST_AGENT_ENGINE }}
          TEST_AGENT_STUB_SCENARIO: ${{ vars.TEST_AGENT_STUB_SCENARIO }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set +e
          python -m test_agent run --repo target --changes out/changes.json --out out
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Build patch from the agent's edits
        id: patch
        if: steps.agent.outputs.exit_code == '0'
        working-directory: target
        run: |
          # Ignore hooks and fsmonitor so nothing in the checkout can run code here.
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false add --all
          git -c core.fsmonitor=false diff --cached --binary --no-color --no-ext-diff --no-textconv \
            > ../out/changes.patch
          echo "sha256=$(sha256sum ../out/changes.patch | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          git diff --cached --stat

      - name: Upload agent output
        if: ${{ !cancelled() && steps.changes.outputs.has_testable_changes == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-output
          path: out/
          retention-days: 7
          if-no-files-found: error

  verify:
    name: Verify tests
    needs: generate
    if: needs.generate.outputs.has_changes == 'true' && needs.generate.outputs.agent_exit == '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      status: ${{ steps.result.outputs.status }}
    env:
      SANDBOX: tooling/.github/scripts/sandbox_run.sh
      RESULTS: target/.test-agent-results
    steps:
      - name: Check out tooling (base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          persist-credentials: false

      - name: Download agent output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-output
          path: out

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check patch integrity
        env:
          EXPECTED_SHA256: ${{ needs.generate.outputs.patch_sha256 }}
        run: echo "${EXPECTED_SHA256}  out/changes.patch" | sha256sum --check --strict

      - name: Validate patch
        id: validate
        run: |
          if python tooling/.github/scripts/validate_patch.py \
              --patch out/changes.patch --policy tooling/.github/test-agent.toml --out out/validation.json; then
            valid=true
          else
            valid=false
          fi
          {
            echo "valid=${valid}"
            echo "empty=$(jq -r '(.files | length) == 0' out/validation.json)"
            echo "backend=$(jq -r '.components | index("backend") != null' out/validation.json)"
            echo "frontend=$(jq -r '.components | index("frontend") != null' out/validation.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Build sandbox image
        if: steps.validate.outputs.valid == 'true' && steps.validate.outputs.empty == 'false'
        run: docker build --quiet --tag test-agent-sandbox tooling/.github/sandbox

      - name: Install backend dependencies
        if: steps.validate.outputs.valid == 'true' && steps.validate.outputs.backend == 'true'
        run: |
          python -m venv target/backend/.venv
          # Wheels only: installing must not run code from source distributions.
          target/backend/.venv/bin/pip install --quiet --only-binary=:all: -r target/backend/requirements.txt

      - name: Set up Node.js
        if: steps.validate.outputs.valid == 'true' && steps.validate.outputs.frontend == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install frontend dependencies
        if: steps.validate.outputs.valid == 'true' && steps.validate.outputs.frontend == 'true'
        working-directory: target/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run tests before and after the patch (sandboxed)
        id: tests
        if: steps.validate.outputs.valid == 'true' && steps.validate.outputs.empty == 'false'
        env:
          RUN_BACKEND: ${{ steps.validate.outputs.backend }}
          RUN_FRONTEND: ${{ steps.validate.outputs.frontend }}
        run: |
          mkdir -p "$RESULTS"
          backend() {
            "$SANDBOX" target backend .venv/bin/python -m pytest -q -p no:cacheprovider \
              --cov=app --cov-report="json:../.test-agent-results/backend-$1.json" "${@:2}"
          }
          frontend() {
            "$SANDBOX" target frontend node_modules/.bin/vitest run --coverage \
              --coverage.reporter=json-summary --coverage.reportsDirectory="../.test-agent-results/frontend-$1" "${@:2}"
          }
          failed=false
          if [ "$RUN_BACKEND" = true ]; then
            backend before || echo "::warning::Backend tests already fail without the agent's patch"
          fi
          if [ "$RUN_FRONTEND" = true ]; then
            frontend before || echo "::warning::Frontend tests already fail without the agent's patch"
          fi

          git -C target apply --whitespace=nowarn "$GITHUB_WORKSPACE/out/changes.patch"

          if [ "$RUN_BACKEND" = true ]; then
            backend after --junitxml=../.test-agent-results/backend-junit.xml || failed=true
          fi
          if [ "$RUN_FRONTEND" = true ]; then
            frontend after --reporter=default --reporter=junit \
              --outputFile.junit=../.test-agent-results/frontend-junit.xml || failed=true
          fi
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      - name: Compute coverage change
        if: steps.tests.outcome == 'success'
        run: |
          args=()
          if [ -f "$RESULTS/backend-before.json" ] && [ -f "$RESULTS/backend-after.json" ]; then
            args+=(--backend-before "$RESULTS/backend-before.json" --backend-after "$RESULTS/backend-after.json")
          fi
          if [ -f "$RESULTS/frontend-before/coverage-summary.json" ] && [ -f "$RESULTS/frontend-after/coverage-summary.json" ]; then
            args+=(--frontend-before "$RESULTS/frontend-before/coverage-summary.json"
                   --frontend-after "$RESULTS/frontend-after/coverage-summary.json"
                   --frontend-root "$GITHUB_WORKSPACE/target/frontend")
          fi
          if [ ${#args[@]} -gt 0 ]; then
            python tooling/.github/scripts/coverage_delta.py "${args[@]}" --out out/coverage-delta.json
          fi
          cp "$RESULTS"/*-junit.xml out/ 2>/dev/null || true

      - name: Decide result
        id: result
        env:
          VALID: ${{ steps.validate.outputs.valid }}
          EMPTY: ${{ steps.validate.outputs.empty }}
          FAILED: ${{ steps.tests.outputs.failed }}
        run: |
          if [ "$VALID" != true ]; then status=rejected
          elif [ "$EMPTY" = true ]; then status=nothing-to-add
          elif [ "$FAILED" = false ]; then status=verified
          else status=tests-failed
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "Verification result: ${status}"

      - name: Upload verification output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-output
          path: |
            out/validation.json
            out/coverage-delta.json
            out/*-junit.xml
          retention-days: 7
          if-no-files-found: warn

  publish:
    name: Publish results
    needs: [generate, verify]
    if: ${{ always() && (needs.generate.result == 'success' || needs.generate.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the verified tests
      pull-requests: write # post the report
      actions: write # dispatch CI for the bot's commit (GITHUB_TOKEN pushes trigger no workflows)
    env:
      SCRIPTS: tooling/.github/scripts
    steps:
      - name: Check out tooling (base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tooling
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download agent output
        if: needs.generate.outputs.has_changes == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-output
          path: out

      - name: Download verification output
        if: needs.verify.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-output
          path: verified

      - name: Decide status
        id: status
        env:
          GENERATE_RESULT: ${{ needs.generate.result }}
          HAS_CHANGES: ${{ needs.generate.outputs.has_changes }}
          AGENT_EXIT: ${{ needs.generate.outputs.agent_exit }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          VERIFY_STATUS: ${{ needs.verify.outputs.status }}
        run: |
          detail=""
          if [ "$GENERATE_RESULT" != success ]; then status=agent-failed; detail="The generate job failed; see the workflow run."
          elif [ "$HAS_CHANGES" != true ]; then status=no-changes
          elif [ "$AGENT_EXIT" = 2 ]; then status=agent-failed; detail="The agent is not configured (check TEST_AGENT_ENGINE and the LLM settings)."
          elif [ "$AGENT_EXIT" != 0 ]; then status=agent-failed
          elif [ "$VERIFY_RESULT" != success ]; then status=verify-failed
          else status="$VERIFY_STATUS"
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "detail=${detail}" >> "$GITHUB_OUTPUT"
          echo "Status: ${status}"

      - name: Check out pull request branch
        if: steps.status.outputs.status == 'verified'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          persist-credentials: false

      - name: Commit and push verified tests
        id: commit
        if: steps.status.outputs.status == 'verified'
        env:
          EXPECTED_SHA256: ${{ needs.generate.outputs.patch_sha256 }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          # Re-check the exact bytes that get committed: same hash as produced by
          # the agent's job, and still valid against the base commit's policy.
          echo "${EXPECTED_SHA256}  out/changes.patch" | sha256sum --check --strict
          python "$SCRIPTS/validate_patch.py" --patch out/changes.patch \
            --policy tooling/.github/test-agent.toml --out /dev/null > /dev/null

          cd target
          git -c core.hooksPath=/dev/null apply --index --whitespace=nowarn ../out/changes.patch
          git -c core.hooksPath=/dev/null \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --no-verify \
            -m "test: add unit tests for changed code [test-agent]" \
            -m "Generated-by: test-agent ${RUN_URL}"
          # The token is passed to this one command instead of being stored in .git/config.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          if git -c core.hooksPath=/dev/null -c "http.${GITHUB_SERVER_URL}/.extraheader=${auth}" \
              push --quiet origin "HEAD:refs/heads/${HEAD_REF}"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run CI for the bot's commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"

      - name: Render report
        env:
          STATUS: ${{ steps.status.outputs.status }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          DETAIL: ${{ steps.status.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status="$STATUS"
          if [ "$status" = verified ]; then
            status=$([ "$PUSHED" = true ] && echo committed || echo push-failed)
          fi
          args=(--status "$status" --run-url "$RUN_URL" --out report.md
                --agent-report out/report.json --validation verified/validation.json
                --coverage verified/coverage-delta.json
                --junit backend=verified/backend-junit.xml --junit frontend=verified/frontend-junit.xml)
          [ -n "$COMMIT_SHA" ] && args+=(--commit-sha "$COMMIT_SHA")
          [ -n "$DETAIL" ] && args+=(--detail "$DETAIL")
          python "$SCRIPTS/render_report.py" "${args[@]}"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: steps.status.outputs.status != 'no-changes'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python "$SCRIPTS/upsert_comment.py" --pr "$PR_NUMBER" --body-file report.md
