name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Every job declares the permissions it needs; nothing is granted by default.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term --cov-report=xml --cov-report=json

      - name: Write coverage summary
        if: ${{ !cancelled() && hashFiles('backend/.coverage') != '' }}
        run: |
          {
            echo "## Backend coverage"
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Matches frontend/Dockerfile (node:22) and package.json engines.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Write coverage summary
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        run: |
          node --input-type=module >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import { readFileSync } from 'node:fs'
          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'))
          console.log('## Frontend coverage\n')
          console.log('| Metric | Covered | Total | % |')
          console.log('| --- | ---: | ---: | ---: |')
          for (const metric of ['statements', 'branches', 'functions', 'lines']) {
            const { covered, total: count, pct } = total[metric]
            console.log(`| ${metric} | ${covered} | ${count} | ${pct}% |`)
          }
          EOF

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
          if-no-files-found: warn

  workflow-scripts:
    name: Workflow scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The scripts use only the standard library; pytest is needed for their tests.
      - name: Install pytest
        run: python -m pip install pytest==9.1.1

      - name: Run tests
        run: python -m pytest

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: "1.30.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" actionlint
          echo "${PWD}" >> "$GITHUB_PATH"

      - name: Lint workflows (actionlint)
        run: actionlint -color

      - name: Audit workflows (zizmor)
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline --format=github .github/workflows
